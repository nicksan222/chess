name: Firmware checks

on:
  workflow_call:
    inputs:
      image:
        description: Prebuilt development container image
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  firmware-metadata:
    name: Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - run: just --justfile apps/firmware/justfile yocto-check

  generated-crates:
    name: Generated crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cache/yocto/layers
          key: ${{ runner.os }}-yocto-layers-${{ hashFiles('apps/firmware/yocto/kas/firmware.yml') }}
      # BitBake uses unprivileged user namespaces inside the container; Ubuntu's
      # AppArmor restriction on the hosted runner otherwise blocks its sanity check.
      - name: Allow BitBake user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just --justfile apps/firmware/justfile verify-crates

  firmware-binary:
    name: AArch64 binary
    needs: [firmware-metadata, generated-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just firmware-binary
          cache-key: ${{ runner.os }}-firmware-aarch64-${{ hashFiles('**/Cargo.lock') }}
          cache-restore-keys: |
            ${{ runner.os }}-firmware-aarch64-
            ${{ runner.os }}-cargo-
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-aarch64-${{ github.sha }}
          path: target/aarch64-unknown-linux-gnu/release/firmware
          if-no-files-found: error
          retention-days: 7
