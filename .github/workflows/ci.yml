name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli

      - id: image
        name: Image names
        run: |
          image="$(printf 'ghcr.io/%s/devcontainer:%s' \
            '${{ github.repository }}' '${{ github.sha }}' \
            | tr '[:upper:]' '[:lower:]')"
          latest="$(printf 'ghcr.io/%s/devcontainer:latest' \
            '${{ github.repository }}' \
            | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Build development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker pull "${LATEST}" || true
          devcontainer build \
            --workspace-folder . \
            --image-name "${IMAGE}" \
            --cache-from "${LATEST}"

      - name: Push development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker push "${IMAGE}"
          if [[ "${{ github.event_name }}" == "push" \
             && "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag "${IMAGE}" "${LATEST}"
            docker push "${LATEST}"
          fi

  cad:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: ./tools/cad
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cad-generated
          path: hardware/cad/generated

  pcb:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: env PCB_REVIEW_ONLY=1 ./tools/pcb
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pcb-generated
          path: hardware/pcb/generated

  python:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: ./tools/python

  rust:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: ./tools/rust
