name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: Dev container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.prebuild.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: prebuild
        uses: ./.github/actions/prebuild-devcontainer

  agent-team:
    name: Agent team (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s .agents/team/tests -v

  pi-harness:
    name: Pi harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --cwd .pi --frozen-lockfile
      - run: bun run --cwd .pi check

  hardware:
    name: Hardware
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hardware.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  quality:
    name: Quality
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/quality.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  firmware:
    name: Firmware
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hardware, quality, pi-harness, agent-team]
    permissions:
      contents: write
    uses: ./.github/workflows/firmware.yml
    with:
      publish: true
