name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli

      - id: image
        name: Image names
        run: |
          image="$(printf 'ghcr.io/%s/devcontainer:%s' \
            '${{ github.repository }}' '${{ github.sha }}' \
            | tr '[:upper:]' '[:lower:]')"
          latest="$(printf 'ghcr.io/%s/devcontainer:latest' \
            '${{ github.repository }}' \
            | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Build development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker pull "${LATEST}" || true
          devcontainer build \
            --workspace-folder . \
            --image-name "${IMAGE}" \
            --cache-from "${LATEST}"

      - name: Push development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker push "${IMAGE}"
          if [[ "${{ github.event_name }}" == "push" \
             && "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag "${IMAGE}" "${LATEST}"
            docker push "${LATEST}"
          fi

  firmware-metadata:
    name: Firmware metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.40.0
      - run: just --justfile apps/firmware/justfile validate

  crates:
    name: Discover crates
    needs: prebuild
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: packages
        name: Read workspace packages
        run: |
          packages="$(cargo metadata --format-version 1 --no-deps \
            | jq --compact-output \
              '[.packages[] | {name: .name, directory: (.manifest_path | split("/") | .[-3:-1] | join("/"))}]')"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

  cad:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile hardware/cad/justfile check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cad-generated
          path: hardware/cad/generated

  pcb:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile hardware/pcb/justfile review
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pcb-generated
          path: hardware/pcb/generated

  code-quality:
    name: Code quality
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just quality

  crate-test:
    name: Crate test (${{ matrix.package.name }})
    needs: [prebuild, crates]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.crates.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-crate-${{ matrix.package.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-crate-${{ matrix.package.name }}-
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile ${{ matrix.package.directory }}/justfile test

  firmware-check:
    name: Firmware configuration
    if: github.event_name == 'pull_request'
    needs: [cad, pcb, code-quality, crate-test, firmware-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.40.0
      - run: just --justfile apps/firmware/justfile image-check

  firmware:
    name: Firmware
    if: github.event_name != 'pull_request'
    needs: [cad, pcb, code-quality, crate-test, firmware-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.40.0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
      - id: yocto-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/yocto/downloads
            .cache/yocto/sstate-cache
          key: ${{ runner.os }}-yocto-${{ hashFiles('apps/firmware/yocto/kas/firmware.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-yocto-${{ hashFiles('apps/firmware/yocto/kas/firmware.yml') }}-
            ${{ runner.os }}-yocto-
      - run: just --justfile apps/firmware/justfile image
      - name: Save Yocto cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/yocto/downloads
            .cache/yocto/sstate-cache
          key: ${{ steps.yocto-cache.outputs.cache-primary-key }}
      - run: |
          xz --test dist/firmware/firmware-rpi-zero-2w.img.xz
          (cd dist/firmware && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/firmware
          if-no-files-found: error

  firmware-release:
    name: Firmware release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/firmware
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/firmware/* --clobber
