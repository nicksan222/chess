name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli

      - id: image
        name: Image names
        run: |
          image="$(printf 'ghcr.io/%s/devcontainer:%s' \
            '${{ github.repository }}' '${{ github.sha }}' \
            | tr '[:upper:]' '[:lower:]')"
          latest="$(printf 'ghcr.io/%s/devcontainer:latest' \
            '${{ github.repository }}' \
            | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Build development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker pull "${LATEST}" || true
          devcontainer build \
            --workspace-folder . \
            --image-name "${IMAGE}" \
            --cache-from "${LATEST}"

      - name: Push development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker push "${IMAGE}"
          if [[ "${{ github.event_name }}" == "push" \
             && "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag "${IMAGE}" "${LATEST}"
            docker push "${LATEST}"
          fi

  firmware-metadata:
    name: Firmware metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - run: just --justfile apps/firmware/justfile validate

  crates:
    name: Discover crates
    needs: prebuild
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: packages
        name: Read workspace packages
        run: |
          packages="$(cargo metadata --format-version 1 --no-deps \
            | jq --compact-output \
              '[.packages[] | {name: .name, directory: (.manifest_path | split("/") | .[-3:-1] | join("/"))}]')"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

  cad:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile hardware/cad/justfile check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cad-generated
          path: hardware/cad/generated

  pcb:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile hardware/pcb/justfile review
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pcb-generated
          path: hardware/pcb/generated

  code-quality:
    name: Code quality
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just quality

  crate-test:
    name: Crate test (${{ matrix.package.name }})
    needs: [prebuild, crates]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.crates.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-crate-${{ matrix.package.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-crate-${{ matrix.package.name }}-
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile ${{ matrix.package.directory }}/justfile test

  firmware-plan:
    name: Firmware plan
    if: github.event_name == 'pull_request'
    needs: firmware-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Detect firmware inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            .devcontainer/Dockerfile \
            .github/workflows/ci.yml \
            .github/workflows/firmware.yml \
            apps/firmware \
            crates/logger \
            Cargo.lock \
            Cargo.toml \
            rust-toolchain.toml; then
            echo 'required=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'required=true' >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.changes.outputs.required == 'true'
        uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - if: steps.changes.outputs.required == 'true'
        run: just --justfile apps/firmware/justfile image-check
      - if: steps.changes.outputs.required != 'true'
        run: echo 'Firmware inputs are unchanged; the validated base image plan remains applicable.'

  required-checks:
    name: Required checks
    if: always() && github.event_name == 'pull_request'
    needs: [cad, pcb, code-quality, crate-test, firmware-metadata, firmware-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success")' \
            <<< "${RESULTS}"

  firmware:
    name: Firmware
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cad, pcb, code-quality, crate-test, firmware-metadata]
    permissions:
      contents: write
    uses: ./.github/workflows/firmware.yml
    with:
      publish: true
