name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer:latest

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache workspace toolchains
        uses: actions/cache@v4
        with:
          path: |
            .cache
            target
          key: ${{ runner.os }}-${{ hashFiles('tools/cad', 'hardware/electronics/requirements.txt', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli

      - name: Start development container
        run: |
          image="$(printf '%s' "${DEVCONTAINER_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${image}" || true
          devcontainer build \
            --workspace-folder . \
            --image-name "${image}" \
            --cache-from "${image}"
          devcontainer up --workspace-folder .

      - name: Push development container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="$(printf '%s' "${DEVCONTAINER_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          docker push "${image}"

      - name: Check
        run: devcontainer exec --workspace-folder . ./tools/check

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: generated
          path: |
            hardware/cad/generated
            hardware/electronics/generated
