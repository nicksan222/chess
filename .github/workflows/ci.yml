name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: 🐳 Dev container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.prebuild.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: prebuild
        uses: ./.github/actions/prebuild-devcontainer

  hardware:
    name: 🔧 Hardware
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hardware.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  quality:
    name: ✨ Quality
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/quality.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  firmware:
    name: 📦 Firmware
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hardware, quality]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/firmware.yml
    with:
      publish: true
