name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli

      - id: image
        name: Image names
        run: |
          image="$(printf 'ghcr.io/%s/devcontainer:%s' \
            '${{ github.repository }}' '${{ github.sha }}' \
            | tr '[:upper:]' '[:lower:]')"
          latest="$(printf 'ghcr.io/%s/devcontainer:latest' \
            '${{ github.repository }}' \
            | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Build development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker pull "${LATEST}" || true
          devcontainer build \
            --workspace-folder . \
            --image-name "${IMAGE}" \
            --cache-from "${LATEST}"

      - name: Push development container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker push "${IMAGE}"
          if [[ "${{ github.event_name }}" == "push" \
             && "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag "${IMAGE}" "${LATEST}"
            docker push "${LATEST}"
          fi

  firmware-metadata:
    name: Firmware metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.40.0
      - run: just --justfile apps/firmware/justfile validate

  crates:
    name: Discover crates
    needs: prebuild
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: packages
        name: Read workspace packages
        run: |
          packages="$(cargo metadata --format-version 1 --no-deps \
            | jq --compact-output \
              '[.packages[] | {name: .name, directory: (.manifest_path | split("/") | .[-3:-1] | join("/"))}]')"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

  cad:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile hardware/cad/justfile check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cad-generated
          path: hardware/cad/generated

  pcb:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile hardware/pcb/justfile review
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pcb-generated
          path: hardware/pcb/generated

  code-quality:
    name: Code quality
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just quality

  crate-test:
    name: Crate test (${{ matrix.package.name }})
    needs: [prebuild, crates]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.crates.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-crate-${{ matrix.package.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-crate-${{ matrix.package.name }}-
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just --justfile ${{ matrix.package.directory }}/justfile test

  firmware-binary:
    name: Firmware binary (AArch64)
    needs: [prebuild, firmware-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-firmware-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-firmware-aarch64-
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ needs.prebuild.outputs.image }}
          command: just firmware-binary
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-aarch64-${{ github.sha }}
          path: target/aarch64-unknown-linux-gnu/release/firmware
          if-no-files-found: error
          retention-days: 7

  required-checks:
    name: Required checks
    if: always() && github.event_name == 'pull_request'
    needs: [cad, pcb, code-quality, crate-test, firmware-metadata, firmware-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success")' \
            <<< "${RESULTS}"

  firmware:
    name: Firmware
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cad, pcb, code-quality, crate-test, firmware-metadata, firmware-binary]
    permissions:
      contents: write
    uses: ./.github/workflows/firmware.yml
    with:
      publish: true
