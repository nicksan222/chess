name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo check --workspace
      - run: cargo test --workspace
