name: Hardware

on:
  workflow_call:
    inputs:
      image:
        description: Prebuilt development container image
        type: string
        required: true
      base-ref:
        description: Base commit for a pull-request hardware report
        type: string
        required: false
        default: ""
      pcb:
        description: Review and regenerate the PCB
        type: boolean
        required: false
        default: true
      cad:
        description: Check and regenerate CAD regardless of the PCB export
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read

jobs:
  board:
    name: 🧩 PCB → CAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 🐳 Prepare hardware container
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: "true"
      - name: 🔎 Check shared hardware contracts
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          prepare: "false"
          command: just --justfile hardware/shared/justfile check
      - name: 🔍 Review PCB
        id: pcb_review
        if: ${{ inputs.pcb && inputs.base-ref == '' }}
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          prepare: "false"
          command: just --justfile hardware/pcb/justfile review
      - name: 🔍 Review PCB and generate pull-request report
        id: pcb_pr_review
        if: ${{ inputs.pcb && inputs.base-ref != '' }}
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          prepare: "false"
          command: just --justfile hardware/pcb/justfile pr-report ${{ inputs.base-ref }}
      - name: 🔎 Decide whether CAD needs regenerating
        id: cad_needed
        shell: bash
        env:
          FORCE: ${{ inputs.cad }}
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          # CAD consumes only these PCB outputs. Without a CAD-scope change it
          # runs only when the PCB review regenerated them differently from the
          # pull request's merge base; on main (no base) it always runs.
          export_files=(chess-board.glb 3d-models.json pcb-components.json chess-board.kicad_pcb)
          paths=("${export_files[@]/#/hardware/pcb/generated/}")
          if [[ "$FORCE" == true || -z "$BASE_REF" ]]; then
            run=true
          elif git diff --quiet "$(git merge-base "$BASE_REF" HEAD)" -- "${paths[@]}"; then
            run=false
            echo "The PCB export CAD consumes is unchanged; skipping CAD."
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: 📐 Check CAD using the reviewed PCB model
        id: cad
        if: ${{ steps.cad_needed.outputs.run == 'true' }}
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          prepare: "false"
          command: just --justfile hardware/cad/justfile quality test generate
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.pcb_review.outcome == 'success' || steps.pcb_pr_review.outcome == 'success') }}
        with:
          if-no-files-found: error
          name: pcb-generated
          path: hardware/pcb/generated
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.cad.outcome == 'success' }}
        with:
          if-no-files-found: error
          name: cad-generated
          path: hardware/cad/generated
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.pcb_pr_review.outcome == 'success' }}
        with:
          if-no-files-found: error
          name: pcb-pr-report
          path: pcb-pr-report.md
