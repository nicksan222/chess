name: Hardware

on:
  workflow_call:
    inputs:
      image:
        description: Prebuilt development container image
        type: string
        required: true
      base-ref:
        description: Base commit for a pull-request hardware report
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  cad:
    name: CAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just --justfile hardware/cad/justfile check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cad-generated
          path: hardware/cad/generated

  pcb:
    name: PCB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Review PCB
        if: ${{ inputs.base-ref == '' }}
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just --justfile hardware/pcb/justfile review
      - name: Review PCB and generate pull-request report
        if: ${{ inputs.base-ref != '' }}
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just --justfile hardware/pcb/justfile pr-report ${{ inputs.base-ref }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pcb-generated
          path: hardware/pcb/generated
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.base-ref != '' }}
        with:
          name: pcb-pr-report
          path: pcb-pr-report.md
