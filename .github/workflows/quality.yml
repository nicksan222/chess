name: Quality

on:
  workflow_call:
    inputs:
      image:
        description: Prebuilt development container image
        type: string
        required: true

      hardware:
        description: Hardware workflow owns Python quality checks
        type: boolean
        default: false
      rust:
        description: Run Rust tests and networked dependency checks
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  code-quality:
    name: 🧹 Code quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🧹 Format and lint
        uses: ./.github/actions/rust-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just quality ${{ !inputs.hardware }}
          cache-key: ${{ runner.os }}-quality-${{ hashFiles('**/Cargo.lock') }}
          cache-restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🧪 Test Rust workspace
        if: ${{ inputs.rust }}
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          prepare: "false"
          command: just rust-test

  dependencies:
    name: 🛡️ Dependencies
    if: ${{ inputs.rust }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🛡️ Run dependency checks
        uses: ./.github/actions/run-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just --justfile tooling/quality/justfile audit unused-dependencies python-audit
