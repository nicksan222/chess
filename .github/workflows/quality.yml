name: Quality

on:
  workflow_call:
    inputs:
      image:
        description: Prebuilt development container image
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  crates:
    name: Discover crates
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: packages
        name: Read workspace packages
        run: |
          packages="$(cargo metadata --format-version 1 --no-deps \
            | jq --compact-output \
              '[.packages[] | {name: .name, directory: (.manifest_path | split("/") | .[-3:-1] | join("/"))}]')"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just quality
          cache-key: ${{ runner.os }}-quality-${{ hashFiles('**/Cargo.lock') }}
          cache-restore-keys: |
            ${{ runner.os }}-cargo-

  crate-test:
    name: Crate test (${{ matrix.package.name }})
    needs: crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.crates.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-in-devcontainer
        with:
          image: ${{ inputs.image }}
          command: just --justfile ${{ matrix.package.directory }}/justfile test
          cache-key: ${{ runner.os }}-crate-${{ matrix.package.name }}-${{ hashFiles('**/Cargo.lock') }}
          cache-restore-keys: |
            ${{ runner.os }}-crate-${{ matrix.package.name }}-
            ${{ runner.os }}-cargo-
