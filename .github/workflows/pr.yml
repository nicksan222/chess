name: PR

on:
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Changed scopes
    runs-on: ubuntu-latest
    outputs:
      hardware: ${{ steps.scopes.outputs.hardware }}
      pcb: ${{ steps.scopes.outputs.pcb }}
      cad: ${{ steps.scopes.outputs.cad }}
      rust: ${{ steps.scopes.outputs.rust }}
      quality: ${{ steps.scopes.outputs.quality }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scopes
        run: |
          .github/scripts/changed-scopes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"

  prebuild:
    name: 🐳 Dev container
    needs: changes
    if: ${{ needs.changes.outputs.hardware == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.prebuild.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: prebuild
        uses: ./.github/actions/prebuild-devcontainer

  hardware:
    name: 🔧 Hardware
    needs: [changes, prebuild]
    if: ${{ needs.changes.outputs.hardware == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hardware.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}
      base-ref: ${{ github.event.pull_request.base.sha }}
      pcb: ${{ needs.changes.outputs.pcb == 'true' }}
      cad: ${{ needs.changes.outputs.cad == 'true' }}

  hardware-report:
    name: 📝 Hardware PR report
    needs: [changes, hardware]
    # The report comes from the PCB review, which a CAD-only change skips.
    if: ${{ needs.hardware.result == 'success' && needs.changes.outputs.pcb == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pcb-pr-report
      - name: 💬 Create, update, or remove PCB change report
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pcb-review-report -->';
            const body = fs.readFileSync('pcb-pr-report.md', 'utf8');
            const changed = body.includes('<!-- pcb-design-changed: true -->');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (!changed && previous) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
              });
            } else if (changed && previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else if (changed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            await core.summary.addRaw(body).write();
      - name: 📋 Publish report to job summary for forked pull requests
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: cat pcb-pr-report.md >> "${GITHUB_STEP_SUMMARY}"

  quality:
    name: ✨ Quality
    needs: [changes, prebuild]
    if: ${{ needs.changes.outputs.hardware == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.quality == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/quality.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}
      hardware: ${{ needs.changes.outputs.hardware == 'true' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  firmware-check:
    name: 🔌 Firmware checks
    needs: [changes, prebuild]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/firmware-check.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  required-checks:
    name: Required checks
    if: always()
    needs: [changes, prebuild, hardware, hardware-report, quality, firmware-check]
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Verify required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Jobs skipped because their scope is unchanged count as passing.
          jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "${RESULTS}"
