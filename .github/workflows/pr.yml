name: PR

on:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: Dev container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.prebuild.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: prebuild
        uses: ./.github/actions/prebuild-devcontainer

  pi-harness:
    name: Pi harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --cwd .pi --frozen-lockfile
      - run: bun run --cwd .pi check

  hardware:
    name: Hardware
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hardware.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  quality:
    name: Quality
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/quality.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  firmware-check:
    name: Firmware checks
    needs: prebuild
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/firmware-check.yml
    with:
      image: ${{ needs.prebuild.outputs.image }}

  required-checks:
    name: Required checks
    if: always()
    needs: [hardware, quality, pi-harness, firmware-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success")' \
            <<< "${RESULTS}"
