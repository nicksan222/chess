name: Run in development container
description: Prepare or reuse the job container and execute a command through the Dev Container CLI

inputs:
  image:
    description: Prebuilt development container image
    required: true
  command:
    description: Command to run inside the container
    required: true

  prepare:
    description: Prepare the job container before executing (false reuses it)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: docker/login-action@v4
      if: ${{ inputs.prepare == 'true' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Install Dev Container CLI
      if: ${{ inputs.prepare == 'true' }}
      shell: bash
      run: npm install --global @devcontainers/cli
    - name: Run
      shell: bash
      env:
        DEVCONTAINER_IMAGE: ${{ inputs.image }}
        DEVCONTAINER_PREPARE: ${{ inputs.prepare }}
      run: .github/scripts/with-devcontainer.sh ${{ inputs.command }}
