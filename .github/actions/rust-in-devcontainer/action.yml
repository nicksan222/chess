name: Rust in development container
description: Restore the Cargo target cache and run one command in the prebuilt image

inputs:
  image:
    description: Prebuilt development container image
    required: true
  command:
    description: Command to run inside the container
    required: true
  cache-key:
    description: Primary actions/cache key for the Cargo target directory
    required: true
  cache-restore-keys:
    description: Newline-separated fallback cache keys
    required: false

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: target
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.cache-restore-keys }}
    - uses: ./.github/actions/run-in-devcontainer
      with:
        image: ${{ inputs.image }}
        command: ${{ inputs.command }}
