name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This is not a private security report.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Firmware
        - Rust software
        - PCB
        - CAD
        - Documentation or tooling
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include commit, OS, tool versions, and relevant hardware revision.
  - type: textarea
    attributes:
      label: Additional context
      description: Add logs, screenshots, measurements, or other useful evidence.
