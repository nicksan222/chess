repos:
  - repo: local
    hooks:
      - id: firmware-crate-metadata
        name: Check generated Yocto crate metadata
        entry: just --justfile apps/firmware/justfile validate
        language: system
        pass_filenames: false
        files: ^apps/firmware/(Cargo\.toml|yocto/(Cargo\.(toml|lock)|meta-firmware/recipes-firmware/firmware/firmware-crates\.inc))$
      - id: repository-check
        name: Run the package-owned repository commit gate
        entry: just precommit
        language: system
        pass_filenames: false
        always_run: true
