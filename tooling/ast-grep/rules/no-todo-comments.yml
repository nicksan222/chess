id: no-todo-comments
language: rust
severity: error
message: TODO-style comment in Rust source.
note: |
  Open an issue for unfinished work and describe the current behaviour in the
  comment instead; markers like TODO, FIXME, XXX and HACK go stale unseen.
files:
  - apps/**/*.rs
  - crates/**/*.rs
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  regex: '\b(TODO|FIXME|XXX|HACK)\b'
