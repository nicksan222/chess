id: events-no-domain-policy
valid:
  - |
    use std::{error::Error, fmt};
  - |
    use tokio::sync::{broadcast, mpsc, watch};
  - |
    struct Envelope<T> { value: T }
  - |
    use crate::events::ReceiveError;
  - |
    #[cfg(test)]
    mod tests { use chess::Square; }
invalid:
  - |
    use chess::Square;
  - |
    use ::chess as domain;
  - |
    struct Observation { position: chess::Square }
  - |
    use crate::hardware::pins::Button;
  - |
    use crate::{hardware::PieceEvent, events::Bus};
  - |
    use crate::modules::Request;
  - |
    use crate::runtime::Snapshot;
  - |
    fn update() { crate::menu::input(Button::Ok); }
  - |
    use menu::Input;
  - |
    use persistence::Store;
