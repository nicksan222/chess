id: no-hardcoded-timing
# `ast-grep test` does not apply `ast-grep-ignore` comments; `ast-grep scan` does.
valid:
  - |
    let mut ticks = tokio::time::interval(tuning.poll_interval);
  - |
    const EPOCH: Duration = Duration::from_secs(EARLIEST_EPOCH_SECS);
  - |
    // Polls every Duration::from_millis(5) by default.
  - |
    info!("slept Duration::from_secs(1)");
  - |
    #[cfg(test)]
    mod tests {
        fn wait() { tokio::time::sleep(Duration::from_millis(100)); }
    }
  - |
    #[tokio::test(start_paused = true)]
    async fn waits() { tokio::time::sleep(Duration::from_millis(100)).await; }
invalid:
  - |
    const FRAME: Duration = Duration::from_millis(16);
  - |
    std::thread::sleep(std::time::Duration::from_micros(10));
  - |
    let tick = interval(250);
  - |
    let half = Duration::from_secs_f32(0.5);
  - |
    const T: Duration = Duration::new(1, 0);
  - |
    fn f() { timeout(5, fut); }
