[package]
name = "firmware"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.90"
version.workspace = true

[dependencies]
display-interface = "0.5.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
gpiocdev = "0.8.0"
logger = { path = "../../crates/logger", features = ["std"] }
menu = { path = "../../crates/menu" }
nmrs = "3.5.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
embedded-graphics-simulator = { version = "0.8.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true

# The `modules!` registry macro declares each module (`pub mod $field;`), which
# cargo-shear cannot see.
[package.metadata.cargo-shear]
ignored-paths = ["src/modules/*/mod.rs"]
