# Keep Yocto's offline Cargo build independent of unrelated workspace crates.
[package]
name = "firmware"
edition = "2024"
license = "MIT"
rust-version = "1.90"
version = "0.0.0"

[lib]
name = "firmware"
path = "../src/lib.rs"

[[bin]]
name = "firmware"
path = "../src/main.rs"

[dependencies]
display-interface = "0.5.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
gpiocdev = "0.8.0"
logger = { path = "../../../crates/logger", features = ["std"] }
menu = { path = "../../../crates/menu" }
nmrs = "3.5.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }

# This manifest deliberately starts a small, nested workspace so Cargo resolves
# only the firmware dependency graph when BitBake invokes it with --frozen.
[workspace]
